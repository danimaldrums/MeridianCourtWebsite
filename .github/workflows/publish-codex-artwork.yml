name: Publish approved Codex artwork

on:
  push:
    branches: [main]
    paths:
      - 'artwork/inbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-codex-artwork
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging tools
        run: python -m pip install 'Pillow>=10.4,<13'
      - name: Validate and publish approved portraits
        run: python scripts/publish_codex_artwork.py
      - name: Commit published artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artwork/inbox public/images/codex src/data/codex-artworks.json
          if git diff --cached --quiet; then
            echo "No artwork changes to publish."
            exit 0
          fi
          git commit -m "artwork: publish approved Codex plates"
          git push origin HEAD:main
